buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.2"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["KanjiUpRecognition_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["KanjiUpRecognition_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.kanjiuprecognition"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  aaptOptions {
    noCompress 'tflite'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}

repositories {
  mavenCentral()
  google()
}

project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
project.ext.TEST_ASSETS_DIR = projectDir.toString() + '/src/androidTest/assets'

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-android:0.74.1"

  // org.tensorflow:tensorflow-lite is a dead-end relocation past 2.16.1 (the project renamed to
  // LiteRT) and its last real release only shipped a 4 KB-page-aligned native library, which
  // crashes on 16 KB-page devices. LiteRT keeps the exact same org.tensorflow.lite.* API
  // (Interpreter et al.), just under this new coordinate, with a properly 16 KB-aligned .so.
  implementation 'com.google.ai.edge.litert:litert:2.2.0'
  // No native code of its own (pure Java/Kotlin preprocessing helpers) — unaffected, still current.
  // It transitively pulls the old org.tensorflow:tensorflow-lite though, whose classes collide
  // with LiteRT's (same org.tensorflow.lite.* package) — excluded since LiteRT above provides them.
  implementation('org.tensorflow:tensorflow-lite-support:0.4.4') {
    exclude group: 'org.tensorflow', module: 'tensorflow-lite'
    exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
  }
}

